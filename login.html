<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso | UX na Prática</title>
    <style>
        :root { --roxo: #6848e8; --escuro: #202033; --texto: #626277; --fundo: #f7f6fc; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; color: var(--escuro); font-family: Arial, sans-serif; line-height: 1.6; background-color: var(--fundo); display: flex; flex-direction: column; min-height: 100vh; }
        a { color: inherit; text-decoration: none; }
        .container { width: min(1080px, 90%); margin: auto; }
        
        header { padding: 18px 0; background-color: #ffffff; position: sticky; top: 0; z-index: 1100; border-bottom: 1px solid #e8e6ef; }
        header .container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: bold; }
        .logo span { color: var(--roxo); }
        
        /* Área da Navegação Direita */
        .header-actions { display: flex; align-items: center; gap: 20px; }
        
        /* Dropdown de Conteúdo do Curso */
        .dropdown { 
            position: relative; 
            display: inline-block; 
        }
        .dropdown-btn { 
            color: var(--texto); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 1rem; 
            padding: 8px 0; 
        }
        .dropdown-btn:hover { color: var(--escuro); }
        
        .dropdown-content { 
            display: none; 
            position: absolute; 
            right: 0; 
            top: 100%; 
            background-color: white; 
            min-width: 200px; 
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1); 
            border-radius: 8px; 
            z-index: 1000; 
            overflow: hidden;
        }
        
        .dropdown:hover .dropdown-content { 
            display: block; 
            padding-top: 5px; 
        }

        .dropdown-content a { 
            color: var(--escuro); 
            padding: 12px 16px; 
            display: block; 
            font-size: 0.95rem;
            transition: background 0.2s;
            background-color: white;
        }
        .dropdown-content a:hover { background-color: var(--fundo); color: var(--roxo); }

        /* Ícone de Usuário */
        .user-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background-color: #5593e7;
            color: white;
            border-radius: 50%;
            transition: opacity 0.2s;
        }
        .user-icon:hover { opacity: 0.85; }
        .user-icon svg { width: 22px; height: 22px; fill: currentColor; }

        /* Seção principal contendo o título e o card centralizado */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        h2 {
            margin: 0 0 30px;
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            line-height: 1.2;
            color: var(--escuro);
            text-align: center;
        }

        .auth-box {
            background: #ffffff;
            padding: 40px 50px;
            border: 1px solid #e8e6ef;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(32, 32, 51, 0.08);
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .botao-acao {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 10px;
            background: var(--roxo);
            color: white;
            font-weight: bold;
            font-size: 1.05rem;
            text-align: center;
            transition: background 0.2s, transform 0.1s;
        }
        .botao-acao:hover {
            background: #5034c6;
        }

        footer { padding: 22px 0; background: var(--escuro); color: white; text-align: center; font-size: .9rem; }

        @media (max-width: 600px) {
            .auth-box {
                flex-direction: column;
                width: 100%;
                padding: 30px 20px;
            }
            .header-actions { gap: 10px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a class="logo" href="index.html">UX<span>naPrática</span></a>
            
            <div class="header-actions">
                <!-- Dropdown de Opções -->
                <div class="dropdown">
                    <span class="dropdown-btn">Conteúdo do curso ▾</span>
                    <div class="dropdown-content">
                        <a href="informacoes.html">Resumo do curso</a>
                        <a href="modulo1.html">Módulo 1: Fundamentos</a>
                        <a href="modulo2.html">Módulo 2: Pesquisa</a>
                        <a href="modulo3.html">Módulo 3: Double Diamond</a>
                        <a href="modulo4.html">Módulo 4: Heurísticas</a>
                        <a href="modulo5.html">Módulo 5: Projeto Prático</a>
                    </div>
                </div>

                <!-- Ícone de Perfil/Usuário -->
                <a href="login.html" class="user-icon" title="Minha Conta">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main>
        <h2>Entre para acessar o curso</h2>
        <div class="auth-box">
            <a href="cadastro.html" class="botao-acao">Cadastrar</a>
            <a href="fazer-login.html" class="botao-acao">Entrar</a>
        </div>
    </main>

    <footer>
        <div class="container">© 2026 UX na Prática · Aprenda, pratique, evolua.</div>
    </footer>
</body>
</html>
